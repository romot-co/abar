name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest -q -m "not browser"
  ui:
    name: React UI and browser flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install Python dependencies
        run: uv sync --frozen --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Check UI color contrast (WCAG AA)
        run: python scripts/check_ui_contrast.py
      - name: Build and type-check UI
        working-directory: ui
        run: |
          npm run build
          npm run typecheck
          npm audit --audit-level=high
      - name: Verify generated UI assets are committed
        run: git diff --exit-code -- src/abar/server/static ui/openapi.json ui/src/generated
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Run browser flow
        run: uv run pytest tests/e2e -q -m browser
      - name: Build distributions from the verified UI
        run: uv build
      - name: Install wheel without invoking Node
        run: |
          python -m venv /tmp/abar-wheel-smoke
          /tmp/abar-wheel-smoke/bin/pip install dist/abar-2.0.0-py3-none-any.whl
          /tmp/abar-wheel-smoke/bin/abar --help
          /tmp/abar-wheel-smoke/bin/python -c \
            "from importlib.resources import files; assert (files('abar.server') / 'static' / 'index.html').is_file()"
